# =====================================================================
# Samurai TCG (https://www.samuraitcg.com) — Jumpseller.
#
# Cómo supe que era Jumpseller: la portada declara `generator: Jumpseller` y
# las fichas usan las clases `product-block__*` de su tema.
#
# 27 productos repartidos de 12 en 12, así que son tres páginas.
#
# Cada ficha trae JSON-LD de tipo Product con nombre, precio y disponibilidad,
# que es más fiable que rascar el HTML: el precio del listado y el de la ficha
# no siempre coinciden cuando hay descuento.
# =====================================================================

code: samuraitcg
name: "Samurai TCG"
base_url: "https://www.samuraitcg.com"
adapter: html
enabled: true
currency: CLP
country: CL
default_game: pokemon

categories:
  - name: "Pokémon sellados"
    url: "/pokemon-sellados"
    game: pokemon

pagination:
  mode: query
  param: page
  start: 1
  max_pages: 5

listing:
  # Ojo: cada producto es un <article>, no un <div>. Con `div.product-block`
  # el listado salía vacío sin dar ningún error, que es el fallo más molesto
  # de configurar por selectores.
  item: "article.product-block"
  link: "a.product-block__name"

use_json_ld: true

# SIN selector de precio, a propósito.
#
# El precio se toma del JSON-LD de la ficha, que es el del producto que se
# está mirando. Poner `.product-block__price` fue un error caro: esa clase es
# la de las tarjetas del listado, y la ficha muestra abajo un carrusel de
# productos relacionados con esa misma clase. El selector enganchaba la
# primera tarjeta del carrusel, así que la Ultra Premium Collection de Mega
# Charizard X se guardó a $77.990 cuando vale $249.990 — y salía como la
# oferta más barata de catorce tiendas.
#
# Regla general: en una ficha de producto, un selector que también aparece en
# los listados es sospechoso. El del listado está pensado para muchas
# tarjetas; en la ficha puede haber más de una y la primera no es la buena.
selectors:
  description: ".product-description"
