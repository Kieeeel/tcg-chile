    released: "2025-07-18"

  # "Mega Evolution" es a la vez una expansión y el nombre de toda la serie
  # de 2026 (Phantasmal Flames, Pitch Black, Perfect Order...). Los productos
  # se llaman "Mega Evolution - Pitch Black: Booster Box", así que coinciden
  # los dos nombres. `series_level: true` hace que solo gane cuando no haya
  # ninguna expansión concreta en el nombre.
  - code: sv12
    name: "Mega Evolution"
    series_level: true
    aliases: ["mega evolution", "megaevolution", "megaevolucion", "mega evolucion"]
    released: "2025-09-26"

