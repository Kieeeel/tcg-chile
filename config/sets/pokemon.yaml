# =====================================================================
# Catálogo de expansiones de Pokémon TCG.
#
# `aliases` se comparan sobre el nombre ya normalizado (minúsculas, sin
# acentos, sin puntuación). Gana siempre el alias más largo que coincida,
# por lo que "paradox rift" se detecta antes que "rift".
#
# `strict` = true significa que el alias solo cuenta si aparece completo
# como palabra (útil para números como "151").
# =====================================================================

game: pokemon
game_name: "Pokémon"

sets:
  # --- Scarlet & Violet -------------------------------------------------
  # "Scarlet & Violet" es el nombre de la SERIE completa, no solo de esta
  # expansión: aparece en el nombre de casi todos los productos SV. Por eso
  # `use_name_alias: false` impide que el nombre de la expansión se use como
  # alias y solo se detecta con los alias explícitos de abajo.
  - code: sv01
    name: "Scarlet & Violet"
    use_name_alias: false
    aliases: ["scarlet and violet base set", "scarlet violet base set", "sv base set"]
    released: "2023-03-31"

  - code: sv02
    name: "Paldea Evolved"
    aliases: ["paldea evolved", "evolucionados en paldea"]
    released: "2023-06-09"

  - code: sv03
    name: "Obsidian Flames"
    aliases: ["obsidian flames", "llamas obsidianas"]
    released: "2023-08-11"

  - code: sv035
    name: "151"
    aliases: ["151"]
    strict: true
    released: "2023-09-22"

  - code: sv04
    name: "Paradox Rift"
    aliases: ["paradox rift", "fisura paradojica"]
    released: "2023-11-03"

  - code: sv045
    name: "Paldean Fates"
    aliases: ["paldean fates", "destinos de paldea"]
    released: "2024-01-26"

