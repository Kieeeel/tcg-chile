# ---------------------------------------------------------------------
# Ruido a eliminar del nombre antes de tokenizar.
#
# Son expresiones regulares que se aplican sobre el nombre ya en minúsculas
# y sin acentos, pero con los paréntesis todavía presentes. Sirven para las
# tiendas que meten fechas de preventa o trimestres dentro del título:
#
#   "(Preventa 1 - 04/12/26) 30th Celebration Booster Bundle Inglés"
#      -> "30th celebration booster bundle ingles"
#
# Sin esto, "04", "12" y "26" sobrevivirían como tokens (los números están
# protegidos porque suelen ser el nombre del set, como "151") y ensuciarían
# la comparación entre tiendas.
# ---------------------------------------------------------------------
noise_patterns:
  - '\((?:\s*pre-?venta|\s*pre-?order|\s*pre-?sale)[^)]*\)'   # (Preventa 2 - 16/09/26)
  # "(Q4 2026)" -> se quita el trimestre pero SE CONSERVA el año: en
  # accesorios (portfolios, dados) el año es lo único que distingue una
  # edición de otra.
  - '\bq[1-4]\s+(?=20\d{2}\b)'
  - '\b\d{1,2}/\d{1,2}/\d{2,4}\b'                             # fechas sueltas
  - '\b\d{1,2}\s*de\s*(?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\b'
  # Etiquetas comerciales entre corchetes: "[OFERTA DE REMATE]", "[LIQUIDACIÓN]".
  # No describen el producto, solo la promoción, y sin quitarlas la misma
  # carta en oferta no se compara con la misma carta a precio normal.
  - '\[[^\]]*\b(oferta|remate|liquidacion|promocion|descuento|outlet)\b[^\]]*\]'

# ---------------------------------------------------------------------
# Nombres de SERIE (no de expansión). Aparecen en casi todos los productos
# de una línea ("Scarlet & Violet 151", "Scarlet & Violet Surging Sparks")
# y no distinguen un producto de otro.
#
# Solo se descartan del texto comparado CUANDO la expansión ya se identificó:
# si el set no se pudo detectar, estas palabras se conservan porque entonces
# sí son lo único que diferencia al producto.
# ---------------------------------------------------------------------
series_tokens:
  - "scarlet"
  - "violet"
  - "sword"
  - "shield"
  - "sun"
  - "moon"
  - "xy"
  - "base"

# ---------------------------------------------------------------------
# Reemplazos de caracteres aplicados antes de tokenizar.
# ---------------------------------------------------------------------
char_replacements:
  "&": " and "
  "+": " plus "
  "×": " x "
  "°": " "
  "™": " "
  "®": " "
  "©": " "

# ---------------------------------------------------------------------
# Idiomas.
#
# El idioma es parte de la IDENTIDAD del producto: un Elite Trainer Box en
# español y uno en inglés son productos distintos, con precios distintos, y
# el sistema nunca los agrupa. Por eso conviene detectarlo bien.
#
# Las expresiones se aplican sobre el nombre ya en minúsculas y sin acentos,
# en dos pasadas:
#
#   `strict` : palabras completas e inequívocas -> se prueban primero
#   `loose`  : abreviaturas, más frágiles -> solo si ninguna strict coincidió
#
# Las de `loose` van ancladas al final del nombre o entre separadores para
# no confundirse con palabras corrientes del castellano: "es" y "en" son
# preposiciones, así que solo cuentan al final ("... Booster Box ES").
# ---------------------------------------------------------------------
languages:
  - code: es
    name: "Español"
    strict:    ['\b(espanol|espanola|castellano|spanish)\b']
    delimited: ['[\[\(]\s*(es|esp|spa)\s*[\]\)]']
    loose:     ['\besp\b', '\bspa\b', '\bes$']

  - code: en
    name: "Inglés"
    strict:    ['\b(ingles|inglesa|english)\b']
    delimited: ['[\[\(]\s*(en|ing|eng)\s*[\]\)]']
    loose:     ['\bing\b', '\beng\b', '\ben$']

  - code: jp
    name: "Japonés"
    strict:    ['\b(japones|japonesa|japanese)\b']
    delimited: ['[\[\(]\s*(jp|jap|jpn)\s*[\]\)]']
    loose:     ['\bjap\b', '\bjpn\b', '\bjp$']

  - code: ko
    name: "Coreano"
    strict:    ['\b(coreano|coreana|korean)\b']
    delimited: ['[\[\(]\s*(ko|kor)\s*[\]\)]']
    loose:     ['\bkor\b', '\bko$']

  - code: zh
    name: "Chino"
    strict:    ['\b(chino|china|chinese)\b']
    delimited: ['[\[\(]\s*(zh|chi)\s*[\]\)]']
    loose:     ['\bchi\b', '\bzh$']

  - code: fr
    name: "Francés"
    strict:    ['\b(frances|francesa|french)\b']
    delimited: ['[\[\(]\s*(fr|fra)\s*[\]\)]']
    loose:     ['\bfra\b', '\bfr$']

  - code: de
    name: "Alemán"
    strict:    ['\b(aleman|alemana|german|deutsch)\b']
    delimited: ['[\[\(]\s*(de|ale|ger)\s*[\]\)]']
    loose:     ['\bale\b', '\bger\b', '\bde$']

  - code: it
    name: "Italiano"
    strict:    ['\b(italiano|italiana|italian)\b']
    delimited: ['[\[\(]\s*(it|ita)\s*[\]\)]']
    loose:     ['\bita\b', '\bit$']

  - code: pt
    name: "Portugués"
    strict:    ['\b(portugues|portuguesa|portuguese|brasil)\b']
    delimited: ['[\[\(]\s*(pt|por)\s*[\]\)]']
    loose:     ['\bpor\b', '\bpt$']

# Tokens de idioma que se retiran del texto comparado cuando el idioma ya se
# detectó: la información viaja como atributo y con su propio peso, así que
# repetirla en el nombre solo penalizaría escribir "Inglés" frente a "INGLES".
language_tokens:
  - "espanol"
  - "espanola"
  - "castellano"
  - "spanish"
  - "esp"
  - "spa"
  - "ingles"
  - "inglesa"
  - "english"
