# ---------------------------------------------------------------------
# Stopwords: palabras que no aportan a la identidad del producto.
# NUNCA se eliminan los tokens listados en `protected_tokens` ni los
# tokens canónicos generados por `equivalences` (los que llevan "_").
# ---------------------------------------------------------------------
