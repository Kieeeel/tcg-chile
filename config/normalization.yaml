# ---------------------------------------------------------------------
# Tokens protegidos: aunque aparezcan en `stopwords` jamás se eliminan.
# Los números y los tokens canónicos con "_" están protegidos siempre.
# ---------------------------------------------------------------------
protected_tokens:
  # "x" e "y" distinguen productos reales (Mega Charizard X / Mega Charizard Y)
  # y además "y" es la conjunción castellana, que está en las stopwords: sin
  # protegerla, las dos latas se convertirían en el mismo producto.
  - "x"
  - "y"
  - "151"
