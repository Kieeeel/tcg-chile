# =====================================================================
# Diccionario de normalización de nombres.
#
# Flujo:  texto crudo -> minúsculas / sin acentos / sin puntuación
#         -> equivalencias (frases) -> tokens -> quitar stopwords
#
# Las equivalencias se aplican de frase más larga a más corta, por lo que
# "elite trainer box" se resuelve antes que "box".
# =====================================================================

# ---------------------------------------------------------------------
# Equivalencias: alias  ->  token canónico
# El token canónico usa guiones bajos para mantenerse como una sola pieza.
# ---------------------------------------------------------------------
