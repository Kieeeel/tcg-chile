# =====================================================================
# Vigilancia de enlaces concretos
#
# El scraping normal recorre categorías enteras cada cuatro horas. Esto es
# otra cosa: una lista corta de direcciones que se miran UNA A UNA cada hora,
# para no llegar tarde a una preventa anunciada.
#
# El bot avisa al grupo cuando esa ficha cambia de estado:
#   · aparece (la dirección devolvía 404 y ya no)
#   · se puede comprar (pasa a «en stock» o «preventa»)
#   · cambia de precio
#
# Mientras nada cambie, calla. Mirar cada hora no significa hablar cada hora.
#
# No hace falta que la tienda esté configurada en config/stores/: se lee la
# ficha directamente. Funciona con cualquier tienda que declare el precio en
# JSON-LD, en Open Graph o en la API de WooCommerce, que es casi todas.
# =====================================================================

enabled: true

# ---------------------------------------------------------------------------
# «Sin novedad»
#
# Cuando la revisión no encuentra ningún cambio, decirlo igualmente: así se
# nota que el bot sigue vivo y mirando, en vez de parecer que se cayó.
#
# OJO con `cada_horas`. La revisión va cada cuarto de hora; mandarlo en cada
# pasada serían casi cien mensajes al día, el grupo lo silenciaría, y con él
# silenciaría también el aviso que sí importa. Con 3 salen unos cinco al día.
# Si de verdad lo quieres en cada revisión, pon `cada_horas: 0`.
#
# Un aviso de verdad reinicia la cuenta: no se dice «sin novedad» justo
# después de haber contado algo.
# ---------------------------------------------------------------------------
sin_novedad:
  enabled: true
  cada_horas: 3
  # Franja horaria de Chile. De madrugada no lo lee nadie y solo molesta.
  # Sin esta línea se usa la del relleno en settings.yaml.
  franja: [9, 22]

# Cada línea, una dirección. Con `etiqueta` para leerlo cómodo aquí; si no se
# pone, se usa el nombre que declare la tienda.
#
#   enlaces:
#     - url: "https://www.huntercardtcg.com/producto/lo-que-sea/"
#       etiqueta: "30 aniversario — Elite Trainer Box"
#     - "https://otra-tienda.cl/products/algo"     # también vale a secas
#
# De la dirección solo importa el producto: los `?_pos=…&_sid=…` que añade el
# buscador de la tienda al copiar el enlace se quitan solos. El `?variant=` sí
# se respeta, porque ahí cada variante tiene su precio y su stock.
enlaces:
  # --- 30 aniversario, Piedra Bruja (19-08-2026) -----------------------------
  # Los cinco están publicados y AGOTADOS. Se vigila el momento en que
  # cualquiera pase a poder comprarse.
  - url: "https://piedrabruja.cl/products/pokemon-tcg-30th-celebration-espeon-ultra-premium-collection-ing"
    etiqueta: "30 aniversario · Espeon Ultra Premium Collection (Inglés)"
  - url: "https://piedrabruja.cl/products/pokemon-tcg-30th-celebration-elite-trainer-box-ing"
    etiqueta: "30 aniversario · Elite Trainer Box (Inglés)"
  - url: "https://piedrabruja.cl/products/pokemon-tcg-30th-celebration-umbreon-ultra-premium-collection-esp"
    etiqueta: "30 aniversario · Umbreon Ultra Premium Collection (Español)"
  - url: "https://piedrabruja.cl/products/pokemon-tcg-30th-celebration-booster-bundle-ing"
    etiqueta: "30 aniversario · Booster Bundle (Inglés)"
  - url: "https://piedrabruja.cl/products/pokemon-tcg-30th-ditto-premium-collection-ing"
    etiqueta: "30 aniversario · Ditto Premium Collection (Inglés)"
