# =====================================================================
# Catálogo de tipos de producto.
#
# `units` describe cuántos sobres (boosters) contiene el producto, lo que
# permite calcular "precio por booster". `units_confidence` indica cuánta
# confianza tiene ese valor por defecto cuando el nombre no dice la cantidad.
#
# `incompatible_with` fuerza que dos tipos NUNCA se agrupen aunque el nombre
# se parezca mucho (ej: Booster Bundle vs Booster Box).
# =====================================================================

# ---------------------------------------------------------------------
# Categorías del filtro
#
# Los 26 tipos de abajo son los que necesita el matching: distinguir un
# Booster Bundle de una Booster Box es justo lo que evita agrupar productos
# que no son el mismo. Pero como menú desplegable son demasiados.
#
# Estas categorías son SOLO para el filtro de la pantalla de búsqueda. No
# tocan la agrupación: por dentro cada producto conserva su tipo exacto, que
# es el que se ve en la ficha y el que decide qué se compara con qué.
#
# Para recolocar un tipo, muévelo de lista y recarga la configuración.
# ---------------------------------------------------------------------
categories:
  - code: etb
    name: "ETB"
    types: [elite_trainer_box]

  - code: boosters
    name: "Boosters"
    types: [booster_pack, sleeved_booster, booster_bundle, booster_box,
            half_booster_box, booster_case]

  - code: blisters
    name: "Blisters"
    types: [blister]

  - code: tins
    name: "Tins"
    types: [tin, mini_tin]

  - code: colecciones
    name: "Colecciones"
    types: [ultra_premium_collection, premium_collection, special_collection,
            collection_box, poster_collection, binder_collection]

  # Build & Battle va aquí y no en Blisters: es producto de jugar, formato
  # prerelease, con su mazo dentro.
  - code: decks
    name: "Decks y juego"
    types: [theme_deck, battle_deck, starter_deck, structure_deck, deck,
            build_and_battle_box, build_and_battle_stadium]

  - code: otros
    name: "Otros"
    types: [surprise_box, single_card, accessory]

