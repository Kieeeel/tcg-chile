# ---------------------------------------------------------------------
# Expresiones regulares para extraer la cantidad. Se aplican sobre el
# nombre YA normalizado (minúsculas, sin acentos ni puntuación) y luego,
# si no hubo coincidencia, sobre la descripción.
#
# Se prueban EN ORDEN y gana la primera que coincida, por eso los patrones
# de "contenido" van antes que los de "multiplicador":
#   "Bundle x6 Boosters"  -> contenido 6 sobres   (no 6 bundles)
#   "Booster Pack x10"    -> multiplicador 10
#
# kind:
#   contents   -> el número indica cuántos sobres trae el producto
#   multiplier -> el número indica cuántas unidades del producto se venden
# ---------------------------------------------------------------------
quantity_patterns:
  # Un "Nx" al PRINCIPIO del nombre siempre es un lote, nunca el contenido:
  #   "2x Ascended Heroes Blister 2 Pack"  -> 2 blísteres (no 2 sobres)
  # Va primero porque si no, el "2 Pack" del final se llevaría la coincidencia
  # y el lote acabaría comparándose contra la unidad suelta.
  - pattern: '^\s*(\d{1,3})\s?x\s'
    kind: multiplier
    confidence: 0.9
  - pattern: '\b(\d{1,3})\s+booster\s+packs?\b'
    kind: contents
    confidence: 0.95
  - pattern: '\b(\d{1,3})\s+boosters?\b'
    kind: contents
    confidence: 0.9
  - pattern: '\b(\d{1,3})\s+sobres?\b'
    kind: contents
    confidence: 0.9
  - pattern: '\b(\d{1,3})\s+packs?\b'
    kind: contents
    confidence: 0.85
  - pattern: '\bpack\s+de\s+(\d{1,3})\b'
    kind: contents
    confidence: 0.85
  - pattern: '\bcontiene\s+(\d{1,3})\s+(?:sobres?|boosters?|packs?)\b'
    kind: contents
    confidence: 0.8
  - pattern: '\bx\s?(\d{1,3})\b'
    kind: multiplier
    confidence: 0.85
  - pattern: '\b(\d{1,3})\s?x\b'
    kind: multiplier
    confidence: 0.8

# Números que nunca se interpretan como cantidad (son nombres de expansión).
quantity_blacklist: [151, 2024, 2025, 2026]

# Rango razonable para una cantidad de sobres.
quantity_min: 1
quantity_max: 500
