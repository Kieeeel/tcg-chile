name: Publicar en Telegram

# Cada 10 minutos. No recorre ninguna tienda: saca de la base la siguiente
# oferta pendiente, la publica, y de paso atiende el grupo de pago.
#
# El ritmo tiene dos velocidades, y las decide el propio programa:
#
#   · Con ofertas en cola — una cada 10 minutos, hasta vaciarla. Después de un
#     scraping que encuentra ocho bajadas, salen en hora y veinte.
#   · Sin ofertas — una «oportunidad» del comparador, pero solo una por hora y
#     dentro de la franja de día. Son las horas intermedias entre scrapings.
#
# Va separado del scraping a propósito: publicándolo todo al terminar una
# pasada, el grupo recibía ocho mensajes de golpe y luego cuatro horas de
# silencio, y el trabajo se quedaba casi una hora esperando entre mensajes.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  # Si una publicación se queda colgada, la siguiente hora la reemplaza: es
  # preferible perder un mensaje a acumular trabajos zombis.
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Publicar lo pendiente
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: python run.py --publicar
