name: Preventa (temporal)

# Flujo TEMPORAL para un lanzamiento anunciado. Cada hora hace dos cosas:
#
#   1. Recorre solo Hunter Card TCG. Una tienda sola tarda menos de un minuto,
#      así que se puede mirar cada hora sin cargar nada; el recorrido completo
#      de las veinticinco sigue yendo aparte, cada cuatro horas.
#   2. Publica lo que haya salido, sin esperar al turno de `publicar.yml`.
#
# Los enlaces vigilados van en `vigilancia.yml`, cada cuarto de hora: eso
# tiene que ir rápido y no depende de recorrer ninguna tienda.
#
# Cuando pase el lanzamiento se borra este archivo y se pone
# `preventa.enabled: false` en config/settings.yaml. No hay nada más que
# deshacer: el scraping de las demás tiendas nunca se llegó a tocar.
on:
  schedule:
    # A los cinco de cada hora. Los horarios de GitHub llegan tarde casi
    # siempre; para un intervalo de una hora eso da igual, pero conviene no
    # ponerlo en punto y competir con todo el mundo.
    - cron: "5 * * * *"
  workflow_dispatch:

concurrency:
  # El mismo grupo que el recorrido completo: dos scrapings a la vez sobre la
  # misma base se pisarían al reagrupar.
  group: scraping
  cancel-in-progress: false

jobs:
  preventa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar Hunter Card TCG
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: python run.py --update --store huntercard

      - name: Publicar lo que haya salido
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: python run.py --publicar
