name: Actualizar precios

# ===========================================================================
# EN PAUSA (20-08-2026). El horario está comentado a propósito.
#
# El comparador de las veinticinco tiendas no se está usando: por ahora todo
# el interés está en los enlaces vigilados del 30 aniversario, que van por
# `vigilancia.yml` y no dependen de esto.
#
# PARA REACTIVARLO: quitar el `#` de las dos líneas de `schedule` y `cron` de
# abajo. Nada más. El botón «Run workflow» sigue disponible entretanto, por si
# quieres una pasada suelta sin volver a encender el horario.
#
# QUÉ SE PIERDE MIENTRAS TANTO: los precios de la web envejecen —lo que se ve
# ahí es la última pasada, la del 20 de agosto— y no se detectan bajadas ni
# vueltas a stock del catálogo. Al reactivarlo, la primera pasada generará de
# golpe todos los cambios acumulados; conviene lanzarla a mano y, si el bot
# empieza a anunciar cosas viejas, `scripts/silenciar_eventos.py` los calla.
# ===========================================================================
on:
  # schedule:
    # Los horarios de GitHub son SIEMPRE en UTC, no admiten zona horaria.
    # Chile va cuatro horas por detrás en invierno, así que estas cinco horas
    # UTC caen en Chile a las 20:00, 00:00, 08:00, 12:00 y 16:00.
    #
    # De septiembre a abril, con el horario de verano chileno, se corren una
    # hora: 21:00, 01:00, 09:00, 13:00 y 17:00. GitHub no sabe de cambios de
    # hora; si molesta, se ajustan los números a mano dos veces al año.
    # - cron: "0 0,4,12,16,20 * * *"
  workflow_dispatch:          # y a mano cuando quieras

concurrency:
  # Si una pasada se alarga, la siguiente espera en vez de solaparse: dos
  # scrapings a la vez sobre la misma base se pisarían al reagrupar.
  group: scraping
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    # Solo recorre tiendas: unos 10 minutos. Publicar en Telegram ya no cuelga
    # de aquí, va en `publicar.yml` cada hora.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar tiendas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: python run.py --update

      - name: Resumen
        if: always()
        run: echo "Terminado a las $(date -u '+%H:%M UTC')" >> $GITHUB_STEP_SUMMARY
