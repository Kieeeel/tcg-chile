name: Vigilar enlaces (temporal)

# Mira las direcciones de config/vigilancia.yaml y avisa de lo que cambie.
#
# POR QUÉ ESTO NO ES UN CRON NORMAL
#
# La primera versión pedía `*/15` y confiaba en que GitHub lo cumpliera. No lo
# cumple. Medido sobre 24 horas reales de este mismo repositorio:
#
#     programado   cada 15 min  ->  95 ejecuciones
#     real                          35 ejecuciones  (37 %)
#     hueco entre pasadas           26 min mínimo, 37 mediana, 85 máximo
#     duración del trabajo          46 s
#
# Es decir: el retraso no lo ponía el código —46 segundos— ni las tiendas
# —ninguna cachea, todas responden en vivo—, sino la cola de GitHub. Un
# producto que se ponía a la venta justo después de una pasada podía tardar
# hora y media en anunciarse, y para entonces ya estaba agotado.
#
# La solución es no depender del cron para el ritmo. El trabajo se queda
# mirando en bucle durante dos horas, revisando cada minuto. Así el `cron`
# deja de marcar cada cuánto se mira y pasa a marcar solo cada cuánto se
# releva el turno; y como el turno dura más que el peor hueco medido (85 min),
# siempre hay alguien mirando.
#
# `cancel-in-progress: true` es justo lo que hace falta aquí: cuando GitHub
# concede el turno siguiente, el que estaba corriendo se retira y el nuevo
# toma el relevo. Nunca hay dos a la vez ni un hueco entre medias.
on:
  schedule:
    # Se pide cada cuarto de hora aunque sepamos que no se cumple: cuanto más
    # a menudo se pida, antes llega el relevo. Lo que ya no depende de esto es
    # cada cuánto se revisa.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      durante:
        description: "Minutos vigilando"
        default: "110"
      cada:
        description: "Segundos entre revisiones"
        default: "60"

concurrency:
  group: vigilancia
  cancel-in-progress: true

jobs:
  vigilar:
    runs-on: ubuntu-latest
    # Algo más que el bucle, para que le dé tiempo a cerrar por su cuenta.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Vigilar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DURANTE: ${{ github.event.inputs.durante || '110' }}
          CADA: ${{ github.event.inputs.cada || '60' }}
        run: python run.py --vigilar --durante "$DURANTE" --cada "$CADA"
